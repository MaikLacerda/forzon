<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function() {
        // Stub Vite HMR WebSocket to completely eliminate "WebSocket closed without opened" errors
        try {
          var OrigWebSocket = window.WebSocket;
          if (typeof OrigWebSocket === 'function') {
            window.WebSocket = function(url, protocols) {
              var isViteHmr = (protocols === 'vite-hmr') ||
                              (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('hmr') !== -1));
              if (isViteHmr) {
                var listeners = {};
                return {
                  readyState: 3, // CLOSED
                  url: url,
                  protocol: protocols || '',
                  extensions: '',
                  bufferedAmount: 0,
                  binaryType: 'blob',
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, fn) {
                    listeners[type] = listeners[type] || [];
                    listeners[type].push(fn);
                  },
                  removeEventListener: function(type, fn) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(function(l) { return l !== fn; });
                    }
                  },
                  dispatchEvent: function() { return false; },
                  onopen: null,
                  onmessage: null,
                  onerror: null,
                  onclose: null,
                };
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (_) {}

        // Intercept browser extension noise & HMR WebSocket disconnect noise
        function isIgnorableError(msg, src, err) {
          var str = ((msg || '') + ' ' + (src || '') + ' ' + (err && (err.stack || err.message) || '')).toLowerCase();
          return str.indexOf('metamask') !== -1 ||
                 str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
                 str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('moz-extension://') !== -1 ||
                 str.indexOf('inpage.js') !== -1 ||
                 str.indexOf('failed to connect') !== -1 ||
                 str.indexOf('websocket') !== -1 ||
                 str.indexOf('closed without opened') !== -1 ||
                 str.indexOf('@vite/client') !== -1 ||
                 str.indexOf('vite/client') !== -1;
        }

        // Suppress console.error/warn for Vite websocket noise
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var fullStr = args.map(function(a) { return String(a && (a.stack || a.message) || a || ''); }).join(' ').toLowerCase();
          if (isIgnorableError(fullStr)) return;
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var fullStr = args.map(function(a) { return String(a && (a.stack || a.message) || a || ''); }).join(' ').toLowerCase();
          if (isIgnorableError(fullStr)) return;
          return origConsoleWarn.apply(console, arguments);
        };

        // Capture phase error listener
        window.addEventListener('error', function(e) {
          if (isIgnorableError(e.message, e.filename, e.error)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Capture phase unhandled rejection listener
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var reasonStr = String(reason && (reason.stack || reason.message) || reason || '');
          if (isIgnorableError(reasonStr, '', reason)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Fallback global handlers
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isIgnorableError(msg, url, error)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
        };

        var prevUnhandled = window.onunhandledrejection;
        window.onunhandledrejection = function(e) {
          var reason = e && e.reason;
          var reasonStr = String(reason && (reason.stack || reason.message) || reason || '');
          if (isIgnorableError(reasonStr, '', reason)) {
            if (e && e.preventDefault) e.preventDefault();
            return true;
          }
          if (typeof prevUnhandled === 'function') {
            return prevUnhandled.apply(this, arguments);
          }
        };

        // Restore user theme and accent color preference immediately to avoid flash of theme
        try {
          var savedTheme = localStorage.getItem('athlynx_theme');
          if (savedTheme === 'light-hc') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light-hc');
            document.documentElement.setAttribute('data-theme', 'light-hc');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light-hc');
            document.documentElement.setAttribute('data-theme', 'dark');
          }

          var savedAccent = localStorage.getItem('athlynx_accent') || 'neon-blue';
          document.documentElement.setAttribute('data-accent', savedAccent);
        } catch (_) {}
      })();
    </script>
